# Edit this file to adopt the platform for another university. No code changes needed.
name: "VIT-AP - CampusAI"
tagline: "One open-source, role-based AI campus assistant powered by Gemma 4."
icon: "🎓"
show_demo_credentials: true      # set false for a real deployment
seed_sample_data: true           # load data/sample_docs on first run (fictional demo content)
not_found_message: "I could not find this in the university documents. Please contact the relevant office."
rag:
  top_k: 5
  chunk_chars: 900
  chunk_overlap: 150
  min_similarity: 0.55           # vector gate (only used when embeddings are available)
  min_term_coverage: 0.34        # keyword gate (fraction of question words found in the best passage)
  suggested_questions:
    - "What is the minimum attendance for exam eligibility?"
    - "What time do hostels close in the evening?"
    - "What is the minimum CGPA for placements?"
    - "When do mid-semester exams start?"
